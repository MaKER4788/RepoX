<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
    <link rel="stylesheet" href="/output.css">
    <title>Marketplace Filters · RepoX</title>
    <meta name="description" content="Filter marketplace projects by category, technology, price, and license.">
</head>

<body class="bg-[#0B0D10] text-neutral-50 min-h-screen">

<header class="sticky z-50 bg-neutral-900 border-b border-white/10 border-t-0 border-r-0 border-l-0 border-solid top-0 w-full">
    <div class="flex px-8 h-16 justify-between items-center gap-6 max-w-[1400px] mx-auto">
        <div class="flex items-center gap-8">
            <a href="/" class="flex items-center gap-2">
                <div class="size-8 bg-neutral-200 rounded-lg flex justify-center items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-neutral-900"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
                </div>
                <span class="font-bold text-lg leading-7 tracking-tight">RepoX</span>
            </a>
        </div>
        <div class="flex items-center gap-2">
            <a href="/upload" class="bg-neutral-200 text-neutral-900 font-medium rounded-lg text-sm leading-5 px-4 gap-1.5 h-9 flex items-center hover:opacity-90 transition">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                Sell
            </a>
            <a href="/login" class="size-9 border-white/10 border border-solid rounded-lg overflow-hidden flex justify-center items-center bg-neutral-800 text-sm leading-5 font-medium text-[#a1a1a1] hover:text-neutral-50 transition">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </a>
        </div>
    </div>
</header>

<main class="px-8 py-6">
    <div class="mb-5">
        <h1 class="font-bold text-2xl leading-8 tracking-tight mb-1">Marketplace Filters</h1>
        <p class="text-[#a1a1a1] text-sm leading-5">Category, technology, price, and license filters.</p>
    </div>
    <div class="flex gap-6">
        <aside class="shrink-0 w-64">
            <div class="rounded-lg bg-neutral-900 border-white/10 border border-solid">
                <div class="border-white/10 border-t-0 border-r-0 border-b border-l-0 border-solid flex px-4 py-3 justify-between items-center">
                    <span class="font-semibold text-sm leading-5 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a1a1a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
                        Filters
                    </span>
                    <a href="/marketplace" class="text-[oklch(0.65_0.16_255)] text-xs leading-4 hover:underline">Clear all</a>
                </div>
                <div class="border-white/10 border-t-0 border-r-0 border-b border-l-0 border-solid p-4">
                    <h3 class="font-semibold uppercase text-[#a1a1a1] text-xs leading-4 tracking-wide mb-3">Category</h3>
                    <div class="flex flex-col gap-2.5">
                        <label class="text-sm leading-5 flex items-center gap-2.5 cursor-pointer">
                            <input type="checkbox" name="category" value="AI" class="accent-[oklch(0.55_0.15_255)] size-3.5"> AI
                        </label>
                        <label class="text-sm leading-5 flex items-center gap-2.5 cursor-pointer">
                            <input type="checkbox" name="category" value="Web Development" class="accent-[oklch(0.55_0.15_255)] size-3.5"> Web
                        </label>
                        <label class="text-sm leading-5 flex items-center gap-2.5 cursor-pointer">
                            <input type="checkbox" name="category" value="Mobile Apps" class="accent-[oklch(0.55_0.15_255)] size-3.5"> Mobile
                        </label>
                        <label class="text-sm leading-5 flex items-center gap-2.5 cursor-pointer">
                            <input type="checkbox" name="category" value="Backend" class="accent-[oklch(0.55_0.15_255)] size-3.5"> Backend
                        </label>
                        <label class="text-sm leading-5 flex items-center gap-2.5 cursor-pointer">
                            <input type="checkbox" name="category" value="SaaS" class="accent-[oklch(0.55_0.15_255)] size-3.5"> SaaS
                        </label>
                        <label class="text-sm leading-5 flex items-center gap-2.5 cursor-pointer">
                            <input type="checkbox" name="category" value="Developer Tools" class="accent-[oklch(0.55_0.15_255)] size-3.5"> Developer Tools
                        </label>
                    </div>
                </div>
                <div class="border-white/10 border-t-0 border-r-0 border-b border-l-0 border-solid p-4">
                    <h3 class="font-semibold uppercase text-[#a1a1a1] text-xs leading-4 tracking-wide mb-3">Technology</h3>
                    <div class="flex flex-col gap-2.5">
                        <label class="text-sm leading-5 flex items-center gap-2.5 cursor-pointer">
                            <input type="checkbox" name="tech" value="React" class="accent-[oklch(0.55_0.15_255)] size-3.5"> React
                        </label>
                        <label class="text-sm leading-5 flex items-center gap-2.5 cursor-pointer">
                            <input type="checkbox" name="tech" value="Node.js" class="accent-[oklch(0.55_0.15_255)] size-3.5"> Node.js
                        </label>
                        <label class="text-sm leading-5 flex items-center gap-2.5 cursor-pointer">
                            <input type="checkbox" name="tech" value="Python" class="accent-[oklch(0.55_0.15_255)] size-3.5"> Python
                        </label>
                        <label class="text-sm leading-5 flex items-center gap-2.5 cursor-pointer">
                            <input type="checkbox" name="tech" value="Flutter" class="accent-[oklch(0.55_0.15_255)] size-3.5"> Flutter
                        </label>
                        <label class="text-sm leading-5 flex items-center gap-2.5 cursor-pointer">
                            <input type="checkbox" name="tech" value="Firebase" class="accent-[oklch(0.55_0.15_255)] size-3.5"> Firebase
                        </label>
                    </div>
                </div>
                <div class="border-white/10 border-t-0 border-r-0 border-b border-l-0 border-solid p-4">
                    <h3 class="font-semibold uppercase text-[#a1a1a1] text-xs leading-4 tracking-wide mb-3">Price</h3>
                    <div class="flex flex-col gap-2.5">
                        <label class="text-sm leading-5 flex items-center gap-2.5 cursor-pointer">
                            <input type="radio" name="price" value="free" class="accent-[oklch(0.55_0.15_255)] size-3.5"> Free
                        </label>
                        <label class="text-sm leading-5 flex items-center gap-2.5 cursor-pointer">
                            <input type="radio" name="price" value="under500" class="accent-[oklch(0.55_0.15_255)] size-3.5"> Under ₹500
                        </label>
                        <label class="text-sm leading-5 flex items-center gap-2.5 cursor-pointer">
                            <input type="radio" name="price" value="500to1000" class="accent-[oklch(0.55_0.15_255)] size-3.5"> ₹500–₹1,000
                        </label>
                        <label class="text-sm leading-5 flex items-center gap-2.5 cursor-pointer">
                            <input type="radio" name="price" value="1000to2500" class="accent-[oklch(0.55_0.15_255)] size-3.5"> ₹1,000–₹2,500
                        </label>
                        <label class="text-sm leading-5 flex items-center gap-2.5 cursor-pointer">
                            <input type="radio" name="price" value="2500plus" class="accent-[oklch(0.55_0.15_255)] size-3.5"> ₹2,500+
                        </label>
                    </div>
                </div>
                <div class="p-4">
                    <h3 class="font-semibold uppercase text-[#a1a1a1] text-xs leading-4 tracking-wide mb-3">License</h3>
                    <div class="flex flex-col gap-2.5">
                        <label class="text-sm leading-5 flex items-center gap-2.5 cursor-pointer">
                            <input type="checkbox" name="license" value="Personal" class="accent-[oklch(0.55_0.15_255)] size-3.5"> Personal
                        </label>
                        <label class="text-sm leading-5 flex items-center gap-2.5 cursor-pointer">
                            <input type="checkbox" name="license" value="Commercial" class="accent-[oklch(0.55_0.15_255)] size-3.5"> Commercial
                        </label>
                        <label class="text-sm leading-5 flex items-center gap-2.5 cursor-pointer">
                            <input type="checkbox" name="license" value="Extended" class="accent-[oklch(0.55_0.15_255)] size-3.5"> Extended
                        </label>
                    </div>
                </div>
            </div>
        </aside>
    </div>
</main>

<footer class="border-white/10 border-t border-solid">
    <div class="max-w-[1200px] mx-auto px-6 md:px-8 py-5 flex flex-col sm:flex-row justify-between items-center gap-4 text-[#a1a1a1] text-xs leading-4">
        <span>&copy; 2026 RepoX &middot; Buy. Sell. Build.</span>
        <div class="flex items-center gap-6">
            <a href="#" class="hover:text-neutral-50 transition">Documentation</a>
            <a href="#" class="hover:text-neutral-50 transition">Seller guidelines</a>
            <a href="#" class="hover:text-neutral-50 transition">Privacy</a>
            <a href="#" class="hover:text-neutral-50 transition">Terms</a>
        </div>
    </div>
</footer>

<script src="/javascripts/navbar.js"></script>
</body>
</html>
